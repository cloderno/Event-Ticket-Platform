spring:
  application:
    name: Event-Ticket-Platform

  datasource:
    url: jdbc://postgresql://localhost:5432/postgres
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.hibernate.format_sql: true
      hibernate.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

